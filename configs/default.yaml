# Business Entity Resolution — default config
# Swap the backbone with one key: set backbone.preset to "snowflake"
# or override backbone.repo / backbone.prefix.
#
# ~12h profile: short LoRA InfoNCE (not full backbone) + LightGBM.
# Re-run `python -m src.run --stage all` to resume. Logs: reports/logs/.

seed: 42
team_name: team_jina_er

paths:
  train_dir: dataset/train
  test_dir: dataset/test
  cache_dir: cache
  output_dir: output
  reports_dir: reports
  models_dir: models
  experiments_log: experiments.md

# ---------------------------------------------------------------------------
# Backbone (single swap point)
# ---------------------------------------------------------------------------
backbone:
  preset: jina                 # jina | snowflake
  # jina (text-matching LoRA merged into Qwen3-0.6B, 1024-d, last-token pool)
  repo: jinaai/jina-embeddings-v5-text-small-text-matching
  prefix: "Document: "         # same prefix on BOTH sides, train + inference
  max_seq_length: 64           # 12h: ~2× faster encode than 128
  dim: 1024
  normalize: true
  dtype: bfloat16              # model_kwargs={"dtype": torch.bfloat16}
  trust_remote_code: true
  # Matryoshka truncation for fast blocking (optional)
  matryoshka_dims: [1024, 512, 256]
  encode_views: [combined]              # name/address views are extra encode hours; add them back for ablations
  record_template: "{name} | {address} | {country}"

# Tested drop-in (Apache-2.0). Copy these three keys or use --config configs/snowflake.yaml
# backbone.preset: snowflake
# backbone.repo: Snowflake/snowflake-arctic-embed-l-v2.0
# backbone.prefix: "query: "

split:
  val_frac: 0.10               # 12h: half the val encode / pair work
  n_folds: 2
  stratify_cols: [country, is_singleton]
  # Unlinked S2/S3 share added to the val gallery so train:test size ratios match
  gallery_unlinked_frac: 0.08

normalize:
  nfkc: true
  lowercase: true
  keep_raw: true
  amp_to_and: true
  compute_idf: true            # IDF over ALL source files (train+test) when true
  mine_abbreviations: true     # aligned-token substitutions from matched train pairs
  min_abbrev_count: 8
  n_jobs: -1                   # process-pool normalize; each source parquet is resume-safe
  max_abbrev_pairs: 80000
  max_idf_docs: 1500000        # sample IDF docs; unlabeled X only

blocking:
  same_country_only: true      # matches in train share country; France still works
  k_faiss: 25
  k_tfidf: 20
  k_key: 12
  k_cap: 40                    # step up from 20; check blocking recall before going to 80
  tfidf_analyzer: char
  tfidf_ngram_min: 2
  tfidf_ngram_max: 4
  tfidf_max_features: 80000
  tfidf_min_df: 3
  tfidf_svd_dim: 128
  rare_token_idf_quantile: 0.70
  faiss_index: ivf             # flat | ivf | hnsw
  faiss_nlist: 4096
  faiss_nprobe: 16
  faiss_use_zero_shot: true    # Stage 3 baseline
  faiss_use_finetuned: false   # val block stays zs; test encode uses merged LoRA

features:
  compute_zero_shot_cosine: true
  compute_finetuned_cosine: true
  chunk_pairs: 250000          # 124 GB RAM; smaller is only needed on tight machines
  n_jobs: -1                   # RapidFuzz cpdist workers (-1 = all CPUs)

matcher:
  objective: binary
  metric: binary_logloss
  n_estimators: 800
  learning_rate: 0.08
  num_leaves: 47
  min_child_samples: 50
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 30
  negative_sample_ratio: 8
  n_jobs: -1
  # LightGBM monotone: 1 increasing, -1 decreasing
  # applied to named columns below
  monotone:
    house_num_mismatch: -1
    postcode_mismatch: -1
    name_rf_ratio: 1
    name_rf_token_set: 1
    core_rf_token_set: 1
    cosine_combined: 1

biencoder:
  enabled: true                # short LoRA fine-tune (not full backbone)
  full_finetune: false         # MUST stay false — full FT is hours extra
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  temperature: 0.05            # τ; scale = 1/τ = 20
  scale: 20
  effective_batch_size: 128    # L4 22GB OOM at 1024; InfoNCE graph stays this wide
  mini_batch_size: 16
  lr: 1.0e-4                   # 2e-5 if full_finetune
  full_finetune_lr: 2.0e-5
  warmup_ratio: 0.06
  phase_a_epochs: 1            # one InfoNCE pass
  phase_b_epochs: 0            # skip remine/CoSENT
  hard_negatives_per_anchor: 1
  max_train_pairs: 40000       # ~312 GPU steps at batch 128
  mine_gallery_size: 40000     # encode this many S2/S3 for hard-neg mine only
  eval_gallery_size: 0         # 0 = skip mid-train retrieval eval
  max_hard_neg_pool: 20
  use_matryoshka: true
  use_entity_aware_sampler: true
  no_duplicates: true
  gradient_checkpointing: true
  phase_b_aux_loss: cosent     # cosent | online_contrastive
  online_contrastive_margin: 0.5
  cosent_lambda: 20.0
  eval_ks: [1, 10, 50]

cross_encoder:
  enabled: false               # 1-day profile; LightGBM + stacker is the matcher
  top_n: 10
  max_length: 256
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lr: 1.0e-4
  epochs: 2
  batch_size: 16
  negative_sample_ratio: 8
  loss: bce                    # bce | focal
  focal_gamma: 2.0
  swap_order: true

stacker:
  enabled: true
  C: 1.0
  max_iter: 200
  calibration: isotonic

decision:
  rule: expected_f05           # global | relative | expected_f05
  global_threshold: 0.55
  relative_alpha: 0.85
  one_to_one: true
  compare_all_rules: true      # hold-out ablation: global / relative / expected_f05

hardware:
  auto_batch: false            # sizes below are used as-is
  encode_batch_size: 512
  faiss_gpu: false             # CPU FAISS; 124 GB RAM holds 10M×1024-d indexes

debug:
  max_s1: null                 # set an int to subsample S1 for a dry run
  max_gallery: null
  fast: false
