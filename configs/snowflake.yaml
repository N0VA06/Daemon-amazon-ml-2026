# Drop-in Apache-2.0 backbone. Same pipeline, one config key change.
#   python -m src.run --stage all --config configs/snowflake.yaml

seed: 42
team_name: team_jina_er

paths:
  train_dir: dataset/train
  test_dir: dataset/test
  cache_dir: cache
  output_dir: output
  reports_dir: reports
  models_dir: models
  experiments_log: experiments.md

backbone:
  preset: snowflake
  repo: Snowflake/snowflake-arctic-embed-l-v2.0
  prefix: "query: "
  max_seq_length: 128
  dim: 1024
  normalize: true
  dtype: bfloat16
  trust_remote_code: false
  matryoshka_dims: [1024, 512, 256]
  encode_views: [combined, name, address]
  record_template: "{name} | {address} | {country}"

split:
  val_frac: 0.20
  n_folds: 3
  stratify_cols: [country, is_singleton]
  gallery_unlinked_frac: 0.20

normalize:
  nfkc: true
  lowercase: true
  keep_raw: true
  amp_to_and: true
  compute_idf: true
  mine_abbreviations: true
  min_abbrev_count: 8

blocking:
  same_country_only: true
  k_faiss: 50
  k_tfidf: 30
  k_key: 20
  k_cap: 80
  tfidf_analyzer: char
  tfidf_ngram_min: 2
  tfidf_ngram_max: 4
  tfidf_max_features: 200000
  tfidf_min_df: 3
  tfidf_svd_dim: 256
  rare_token_idf_quantile: 0.70
  faiss_index: ivf
  faiss_nlist: 4096
  faiss_nprobe: 32
  faiss_use_zero_shot: true
  faiss_use_finetuned: true

features:
  compute_zero_shot_cosine: true
  compute_finetuned_cosine: true
  chunk_pairs: 100000

matcher:
  objective: binary
  metric: binary_logloss
  n_estimators: 800
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 50
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 50
  negative_sample_ratio: 8
  n_jobs: -1
  monotone:
    house_num_mismatch: -1
    postcode_mismatch: -1
    name_rf_ratio: 1
    name_rf_token_set: 1
    core_rf_token_set: 1
    cosine_combined: 1

biencoder:
  enabled: true
  full_finetune: false
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  temperature: 0.05
  scale: 20
  effective_batch_size: 512
  mini_batch_size: 32
  lr: 1.0e-4
  full_finetune_lr: 2.0e-5
  warmup_ratio: 0.10
  phase_a_epochs: 2
  phase_b_epochs: 1
  hard_negatives_per_anchor: 2
  max_train_pairs: 400000
  max_hard_neg_pool: 80
  use_matryoshka: true
  use_entity_aware_sampler: true
  use_gist_fallback: true
  gist_guide_frozen: true
  no_duplicates: true
  gradient_checkpointing: true
  phase_b_aux_loss: cosent
  online_contrastive_margin: 0.5
  cosent_lambda: 20.0
  eval_ks: [1, 10, 50]
  train_per_fold: true

cross_encoder:
  enabled: true
  top_n: 10
  max_length: 256
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lr: 1.0e-4
  epochs: 2
  batch_size: 16
  negative_sample_ratio: 8
  loss: bce
  focal_gamma: 2.0
  swap_order: true

stacker:
  enabled: true
  C: 1.0
  max_iter: 200
  calibration: isotonic

decision:
  rule: expected_f05
  global_threshold: 0.55
  relative_alpha: 0.85
  one_to_one: true
  compare_all_rules: true

hardware:
  auto_batch: true
  encode_batch_size: 64
  faiss_gpu: false

debug:
  max_s1: null
  max_gallery: null
  fast: false
